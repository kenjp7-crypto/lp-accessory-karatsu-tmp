name: Deploy to Netlify

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Create site and get site ID
        id: create_site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"

          # まず既存サイトの一覧からIDを探す
          SITE_ID=$(netlify api listSites --data '{}' 2>/dev/null | python3 -c "
          import json,sys
          try:
              sites = json.load(sys.stdin)
              for s in sites:
                  if s.get('name') == '${REPO_NAME}':
                      print(s['site_id'])
                      break
          except Exception:
              pass
          ")

          if [ -z "$SITE_ID" ]; then
            echo "No existing site found. Creating new site: ${REPO_NAME}"
            CREATE_OUTPUT=$(netlify sites:create --name "${REPO_NAME}" --json 2>&1)
            echo "$CREATE_OUTPUT"
            SITE_ID=$(echo "$CREATE_OUTPUT" | python3 -c "import json,sys; print(json.load(sys.stdin).get('site_id',''))" 2>/dev/null)
          fi

          echo "Resolved SITE_ID=${SITE_ID}"
          echo "site_id=${SITE_ID}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          netlify deploy --prod --dir="." --site="${{ steps.create_site.outputs.site_id }}" --auth="${NETLIFY_AUTH_TOKEN}"
